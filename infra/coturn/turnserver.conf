# coturn sample config for Speaker's Garage voice (TURN/STUN).
# The game server issues short-lived TURN credentials (TURN REST API): username = "<expiry>:<user>",
# password = base64(HMAC-SHA1(static-auth-secret, username)). Set the SAME secret in the server's
# TURN_SECRET. Credentials expire after TURN_TTL_SECONDS (default 1 h).

# --- ports (open these in the firewall / security group) ---
listening-port=3478          # STUN/TURN over UDP and TCP
tls-listening-port=5349      # TURN over TLS (turns:), works through strict firewalls
min-port=49160               # UDP relay range: one port per relayed peer connection
max-port=49400

# --- auth: short-lived credentials from the game server ---
use-auth-secret
static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET
realm=speakersgarage.example.com

# --- public address (required on a cloud VM behind 1:1 NAT: public/private) ---
# external-ip=203.0.113.10/10.0.0.5

# --- TLS for turns: (Let's Encrypt certificate for the TURN host name) ---
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# --- hardening ---
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
stale-nonce=600
user-quota=12                # relays per user (a player has at most ~6 voice peers)
total-quota=1200
# never relay into private networks (stops TURN being used to reach internal services)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
# for local testing with clients on this machine/LAN only, comment the private ranges above

log-file=stdout
simple-log
